name: Release-plz

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - develop

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.CENTREON_TECHNIQUE_PAT }}

  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@3aeff7023ad8cf78f561cbd7ac7fbc6cdb5d16b1 # v1

      - uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
